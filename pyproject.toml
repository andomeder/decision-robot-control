[project]
name = "robot-decision-stack"
version = "0.1.0"
description = "System One decision model as robot brain (MicroDuck)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.1.6",
  "numpy>=1.26",
  "pillow>=10.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "h5py>=3.9",
  "imageio[ffmpeg]>=2.31",
  "opencv-python>=4.9",
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
xpu = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "pytorch-triton-xpu==3.5.0",
]
cpu = []

[tool.uv]
# Intel XPU wheels for the optional torch extra
index-strategy = "unsafe-best-match"
package = false

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu" }]
torchvision = [{ index = "pytorch-xpu" }]
pytorch-triton-xpu = [{ index = "pytorch-xpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
